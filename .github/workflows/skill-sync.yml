name: Skill Sync

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  skill-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check skills/autonomous-research matches getedgehq/skills main
        run: scripts/sync_skill.sh --check
