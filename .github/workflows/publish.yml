name: Publish to PyPI

# Publishes opendraft to PyPI via Trusted Publishing (OIDC, no API token).
# Fires when a GitHub Release is published, or manually via the Actions tab.
# One-time setup on PyPI: project opendraft -> Settings -> Publishing ->
# add a GitHub trusted publisher (owner: federicodeponte, repo: opendraft,
# workflow: publish.yml, environment: blank). After that, every release
# auto-publishes with zero token.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Verify prompts are bundled (guards the 1.7.3 packaging bug)
        run: |
          twine check dist/*
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          # Layout-agnostic: prompts ship under a top-level prompts/ dir in the
          # current flat layout; match any prompts/*.md regardless of package root.
          prompts = [n for n in names if "prompts/" in n and n.endswith(".md")]
          assert len(prompts) >= 20, f"expected >=20 prompt files in wheel, got {len(prompts)}: {prompts}"
          assert any(n.endswith("scribe.md") for n in prompts), "scribe.md missing from wheel"
          print(f"OK: {len(prompts)} prompt files bundled in {whl}")
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
